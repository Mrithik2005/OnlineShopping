
<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
        }

        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            padding: 30px;
        }

        .product {
            background: white;
            width: 220px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .product img {
            width: 180px;
            height: 150px;
            object-fit: contain;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        button {
            background: green;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>Online Shopping Store</h1>
        <p>Welcome to Our Shopping Website</p>
    </header>

    <h2>Our Products</h2>
    <h3>Shopping Cart: <span id="cart-count">0</span></h3>

    <div class="products">

        <div class="product">
            <img src="https://placehold.co/180x150?text=Mobile" alt="Mobile">
            <h3>Smartphone</h3>
            <p class="price">₹15,000</p>
            <button onclick="addToCart('Smartphone', 15000)">Add to Cart</button>

        <div class="product">
            <img src="https://placehold.co/180x150?text=Laptop" alt="Laptop">
            <h3>Laptop</h3>
            <p class="price">₹45,000</p>
            <button onclick="addToCart('Laptop', 45000)">Add to Cart</button>
            

        </div>

        <div class="product">
            <img src="https://placehold.co/180x150?text=Headphones" alt="Headphones">
            <h3>Headphones</h3>
            <p class="price">₹1,500</p>
            <button onclick="addToCart('Headphones', 1500)">Add to Cart</button>
        </div>

    </div>

</body>

<script>
let cart = [];

function addToCart(name, price) {
    cart.push({name: name, price: price});

    alert(name + " added to cart!");

    document.getElementById("cart-count").innerText = cart.length;
}
</script>
</body>

</html>
